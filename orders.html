<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Our Memories Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin-body">

  <div class="admin-box" style="max-width:700px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0;">Orders</h2>
      <button id="logout-btn" style="background:none; border:none; color:#C1652F; cursor:pointer; font-size:13px;">Logout</button>
    </div>

    <input type="text" id="search-order" placeholder="Search by order ID, name, or phone..." style="margin-bottom:16px;" />

    <div id="orders-list">Loading...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="products.js"></script>
  <script>
    let allOrders = [];
    let allItems = [];

    async function checkLoginAndLoad() {
      const { data } = await productsClient.auth.getSession();
      if (!data.session) {
        window.location.href = "login.html";
        return;
      }
      loadOrders();
    }

    async function loadOrders() {
      const listEl = document.getElementById("orders-list");

      const { data: orders, error: ordersError } = await productsClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

      if (ordersError) {
        listEl.innerHTML = `<p style="color:red;">Error: ${ordersError.message}</p>`;
        return;
      }

      const { data: items, error: itemsError } = await productsClient
        .from("order_items")
        .select("*");

      if (itemsError) {
        listEl.innerHTML = `<p style="color:red;">Error: ${itemsError.message}</p>`;
        return;
      }

      allOrders = orders;
      allItems = items;
      renderOrders(allOrders);
    }

    function renderOrders(orders) {
      const listEl = document.getElementById("orders-list");

      if (orders.length === 0) {
        listEl.innerHTML = "<p>No orders yet.</p>";
        return;
      }

      listEl.innerHTML = "";

      orders.forEach(order => {
        const itemsForOrder = allItems.filter(i => i.order_id === order.order_id);

        const card = document.createElement("div");
        card.style.cssText = "background:var(--cream-deep); border-radius:14px; padding:16px; margin-bottom:14px;";

        const itemsHtml = itemsForOrder.map(item => `
          <div style="margin-top:8px; padding:10px; background:#fff; border-radius:10px;">
            <p style="font-weight:600; color:var(--brown);">${item.product_name} × ${item.qty} — ₹${item.price}</p>
            ${item.memory_id ? `
              <p style="font-size:12px; color:#999;">Memory ID: ${item.memory_id}</p>
              <button class="gen-qr-btn" data-memid="${item.memory_id}" style="margin-top:6px; background:var(--terracotta); color:#fff; border:none; padding:6px 14px; border-radius:20px; font-size:12px; cursor:pointer;">Generate QR</button>
              <div class="qr-out-${item.memory_id}" style="margin-top:8px;"></div>
            ` : `<p style="font-size:12px; color:#999;">No personalization</p>`}
          </div>
        `).join("");

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <p style="font-weight:700; color:var(--terracotta); font-size:16px;">${order.order_id}</p>
            <p style="font-size:13px; color:#888;">${new Date(order.created_at).toLocaleDateString()}</p>
          </div>
          <p style="margin-top:6px; font-weight:600;">${order.customer_name} · ${order.customer_phone}</p>
          <p style="font-size:13px; color:var(--brown-soft);">${order.address_line1}, ${order.city}, ${order.state} - ${order.pincode}</p>
          <p style="font-size:13px; margin-top:6px;">
            <span style="background:#fff; padding:4px 10px; border-radius:12px;">${order.payment_method}</span>
          </p>
          <p style="font-weight:700; margin-top:8px;">Total: ₹${order.total_amount}</p>

          <div style="margin-top:10px; display:flex; gap:8px; align-items:center;">
            <select class="status-select" data-orderid="${order.order_id}" style="padding:8px; border-radius:8px; border:1px solid #EADFD2; font-size:13px;">
              <option value="pending" ${order.order_status === "pending" ? "selected" : ""}>Pending</option>
              <option value="confirmed" ${order.order_status === "confirmed" ? "selected" : ""}>Confirmed</option>
              <option value="processing" ${order.order_status === "processing" ? "selected" : ""}>Processing</option>
              <option value="packed" ${order.order_status === "packed" ? "selected" : ""}>Packed</option>
              <option value="shipped" ${order.order_status === "shipped" ? "selected" : ""}>Shipped</option>
              <option value="out_for_delivery" ${order.order_status === "out_for_delivery" ? "selected" : ""}>Out for Delivery</option>
              <option value="delivered" ${order.order_status === "delivered" ? "selected" : ""}>Delivered</option>
              <option value="cancelled" ${order.order_status === "cancelled" ? "selected" : ""}>Cancelled</option>
              <option value="returned" ${order.order_status === "returned" ? "selected" : ""}>Returned</option>
              <option value="refunded" ${order.order_status === "refunded" ? "selected" : ""}>Refunded</option>
            </select>
            <button class="update-status-btn" data-orderid="${order.order_id}" style="background:var(--terracotta); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer;">Update</button>
            <span class="status-msg-${order.order_id}" style="font-size:12px;"></span>
          </div>

          ${itemsHtml}
        `;
        listEl.appendChild(card);
      });


      document.querySelectorAll(".update-status-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const orderId = btn.getAttribute("data-orderid");
          const select = document.querySelector(`.status-select[data-orderid="${orderId}"]`);
          const newStatus = select.value;
          const msgEl = document.querySelector(`.status-msg-${orderId}`);

          const { error } = await productsClient
            .from("orders")
            .update({ order_status: newStatus })
            .eq("order_id", orderId);

          if (error) {
            msgEl.textContent = "❌ " + error.message;
            msgEl.style.color = "red";
            return;
          }

          msgEl.textContent = "✅ Updated!";
          msgEl.style.color = "green";

          const orderInMemory = allOrders.find(o => o.order_id === orderId);
          if (orderInMemory) orderInMemory.order_status = newStatus;
        });
      });

      document.querySelectorAll(".gen-qr-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const memId = btn.getAttribute("data-memid");
          const memoryUrl = `${window.location.origin}/memory.html?id=${memId}`;
          const out = document.querySelector(`.qr-out-${memId}`);
          out.innerHTML = "";

          const canvas = document.createElement("canvas");
          out.appendChild(canvas);
          QRCode.toCanvas(canvas, memoryUrl, { width: 130 }, (err) => {
            if (err) console.error(err);
          });

          const link = document.createElement("p");
          link.innerHTML = `<a href="${memoryUrl}" target="_blank" style="font-size:12px;">${memoryUrl}</a>`;
          out.appendChild(link);
        });
      });
    }

    document.getElementById("search-order").addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allOrders.filter(o =>
        o.order_id.toLowerCase().includes(term) ||
        o.customer_name.toLowerCase().includes(term) ||
        o.customer_phone.includes(term)
      );
      renderOrders(filtered);
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await productsClient.auth.signOut();
      window.location.href = "login.html";
    });
    alert("QRCode loaded? " + (typeof QRCode));
    checkLoginAndLoad();
  </script>
</body>
</html>
